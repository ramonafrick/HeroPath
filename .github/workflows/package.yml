name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Hosts/HeroPath.Web -c Release -o artifacts/publish

      - name: Build ZIP
        run: ./deploy/build-zip.ps1 -PublishDir artifacts/publish -Output artifacts/HeroPath.zip

      - name: Smoke test the unpacked ZIP
        run: |
          Expand-Archive -LiteralPath artifacts/HeroPath.zip -DestinationPath artifacts/unpacked
          ./deploy/smoke-test.ps1 -Folder artifacts/unpacked/HeroPath

      - uses: actions/upload-artifact@v7
        with:
          name: HeroPath-zip
          path: artifacts/HeroPath.zip
          if-no-files-found: error

      - name: Attach the ZIP to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" artifacts/HeroPath.zip --clobber
          } else {
            gh release create "$env:TAG" artifacts/HeroPath.zip --title "$env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
