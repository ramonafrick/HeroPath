name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Hosts/HeroPath.Web -c Release -o artifacts/publish

      - name: Build ZIP
        run: ./deploy/build-zip.ps1 -PublishDir artifacts/publish -Output artifacts/HeroPath.zip

      - name: Smoke test the unpacked ZIP
        run: |
          Expand-Archive -LiteralPath artifacts/HeroPath.zip -DestinationPath artifacts/unpacked
          ./deploy/smoke-test.ps1 -Folder artifacts/unpacked/HeroPath

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HeroPath-zip
          path: artifacts/HeroPath.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
    steps:
      # Only a commit on main with a green CI run may be published.
      - name: Check that the tag is on main and CI is green
        run: |
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [ "$status" != "behind" ] && [ "$status" != "identical" ]; then
            echo "::error::Commit $SHA is not on main (compare status: $status)"
            exit 1
          fi
          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful CI run on main for commit $SHA"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: HeroPath-zip
          path: dist

      - name: Attach the ZIP to the release
        run: |
          hash=$(sha256sum dist/HeroPath.zip | cut -d' ' -f1)
          line="SHA-256 of HeroPath.zip: $hash"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/HeroPath.zip --clobber --repo "$REPO"
            body=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body | grep -v '^SHA-256 of HeroPath.zip' || true)
            gh release edit "$TAG" --repo "$REPO" --notes "$body"$'\n\n'"$line"
          else
            gh release create "$TAG" dist/HeroPath.zip --repo "$REPO" --title "$TAG" --generate-notes --notes "$line"
          fi
