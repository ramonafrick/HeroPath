name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HeroPath.slnx

      - name: Format
        run: dotnet format HeroPath.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HeroPath.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution HeroPath.slnx -c Release --no-build

  # Windows like the target laptops: the app uses the system font, and the layout checks depend on its metrics.
  e2e:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build HeroPath.slnx -c Release

      - name: E2E
        shell: bash
        run: |
          set -o pipefail
          dotnet test --project tests/HeroPath.E2E -c Release --no-build 2>&1 | tee e2e.log
        env:
          HEROPATH_E2E: "1"

      # Job logs need a login, annotations are public: name the failed tests there.
      - name: Report failed E2E tests
        if: failure()
        shell: bash
        run: |
          message=$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' e2e.log | grep -E -A8 '^\s*failed ' | head -200 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failed E2E tests::${message:-see job log}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn
