name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HeroPath.slnx

      - name: Format
        run: dotnet format HeroPath.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HeroPath.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution HeroPath.slnx -c Release --no-build

      - name: Install Chromium with system libraries
        run: pwsh tests/HeroPath.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E
        run: dotnet test --project tests/HeroPath.E2E -c Release --no-build
        env:
          HEROPATH_E2E: "1"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn
