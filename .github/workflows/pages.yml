name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Hosts/HeroPath.Web -c Release -o artifacts/publish

      # Compressed copies are dropped: Pages compresses itself, and index.html.br/.gz would keep the old base href.
      - name: Prepare for the /HeroPath/ path
        working-directory: artifacts/publish/wwwroot
        run: |
          grep -q '<base href="/" />' index.html
          sed -i 's|<base href="/" />|<base href="/HeroPath/" />|' index.html
          find . -type f \( -name '*.br' -o -name '*.gz' \) -delete
          cp index.html 404.html
          touch .nojekyll

      - name: Check the published site
        working-directory: artifacts/publish/wwwroot
        run: |
          test -f js/file-download.js
          if grep -rnE 'https?://' . --include=*.html --include=*.css; then
            echo "::error::External URL in the published site"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/publish/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
