name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Hosts/HeroPath.Web -c Release -o artifacts/publish

      # One script for every change to index.html after the publish: base href, Content-Security-Policy, PWA flag,
      # the index.html hash in service-worker-assets.js, 404.html and .nojekyll (see deploy/finish-site.ps1).
      - name: Finish the site for the /HeroPath/ path
        shell: pwsh
        run: ./deploy/finish-site.ps1 -Root artifacts/publish/wwwroot -BaseHref /HeroPath/ -Pwa -Pages

      # Second, independent check: the service worker rejects a file whose hash differs from the manifest, and then
      # the installation fails on the visitor's machine.
      - name: Check the index.html hash in the service worker manifest
        shell: pwsh
        run: |
          $root = (Resolve-Path artifacts/publish/wwwroot).Path
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $actual = 'sha256-' + [Convert]::ToBase64String($sha.ComputeHash([System.IO.File]::ReadAllBytes((Join-Path $root 'index.html'))))
          $assets = [System.IO.File]::ReadAllText((Join-Path $root 'service-worker-assets.js'))
          $entry = [regex]::Match($assets, '"hash":\s*"(sha256-[^"]+)",\s*"url":\s*"index\.html"')
          if (-not $entry.Success) { throw 'service-worker-assets.js has no index.html entry.' }
          if ($entry.Groups[1].Value -ne $actual) { throw "Manifest hash $($entry.Groups[1].Value) does not match index.html ($actual)." }
          $html = [System.IO.File]::ReadAllText((Join-Path $root 'index.html'))
          foreach ($expected in '<base href="/HeroPath/" />', 'http-equiv="Content-Security-Policy"', '<meta name="heropath-pwa" content="on" />') {
            if (-not $html.Contains($expected)) { throw "index.html lacks $expected" }
          }
          if (-not (Test-Path (Join-Path $root '404.html')) -or -not (Test-Path (Join-Path $root '.nojekyll'))) { throw '404.html or .nojekyll is missing.' }
          if (@(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in '.br', '.gz' }).Count -gt 0) { throw 'Compressed files are left.' }
          Write-Host "index.html hash matches the manifest: $actual"

      - name: Check the published site
        working-directory: artifacts/publish/wwwroot
        run: |
          test -f js/file-download.js
          if grep -rnE 'https?://' . --include=*.html --include=*.css || grep -nE 'https?://' js/*.js; then
            echo "::error::External URL in the published site"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: artifacts/publish/wwwroot
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
